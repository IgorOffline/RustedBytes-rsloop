[package]
name = "rsloop"
version = "0.1.41"
edition = "2024"
description = "An event loop for asyncio written in Rust"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/RustedBytes/rsloop"
homepage = "https://github.com/RustedBytes/rsloop"
documentation = "https://github.com/RustedBytes/rsloop#readme"

[lib]
name = "rsloop"
crate-type = ["cdylib", "rlib"]

[features]
default = []
profiler = ["dep:tracy-client", "profiling/profile-with-tracy"]

[dependencies]
async-io = "2"
async-std = "1"
crossbeam-channel = "0.5"
futures = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
memchr = "2"
profiling = "1"
pyo3 = { version = "0.29.2" }
pyo3-async-runtimes = { version = "0.29", features = ["async-std-runtime"] }
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
signal-hook = "0.4"
socket2 = "0.6"
tokio = { version = "1", default-features = false, features = ["io-util"] }
tracy-client = { version = "0.18", default-features = false, features = ["enable", "only-localhost", "sampling"], optional = true }
vibeio = { version = "0.2.15", path = "vendor/vibeio", default-features = false, features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[build-dependencies]
pyo3-build-config = "0.29.2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# PyO3 callbacks and cross-thread workers intentionally transfer owned values.
needless_pass_by_value = "allow"
# Python protocol methods must keep their receiver and awaitable/Result shapes.
unused_self = "allow"
unused_async = "allow"
unnecessary_wraps = "allow"
# These internal types are public for PyO3 registration and compatibility
# re-exports, rather than being a separately documented Rust API.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Explicit lifetimes and descriptive names make the Python/Rust boundary easier
# to audit than the shorter forms suggested by these style-only lints.
elidable_lifetime_names = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
# Keep established control-flow and formatting where the pedantic alternative
# is preference-only and would obscure diffs in hot transport code.
explicit_deref_methods = "allow"
if_not_else = "allow"
manual_is_variant_and = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
needless_continue = "allow"
option_as_ref_cloned = "allow"
redundant_closure_for_method_calls = "allow"
semicolon_if_nothing_returned = "allow"
single_match_else = "allow"
uninlined_format_args = "allow"
# FFI sites retain explicit pointer casts alongside their safety invariants.
borrow_as_ptr = "allow"
ref_as_ptr = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
# strip = true

[profile.bench]
inherits = "release"
